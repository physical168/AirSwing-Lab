<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AirSwing Lab MVP</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#07090d;--panel:#111722;--panel2:#171f2b;--line:#273242;--text:#f6f7f9;--muted:#97a3b3;--green:#45e58a;--red:#ff5b6e;--blue:#68a6ff;--shadow:0 20px 60px rgba(0,0,0,.38)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0}body.flash{animation:hitFlash .26s ease-out}@keyframes hitFlash{0%{background:#f6f7f9;color:#07090d}100%{background:var(--bg);color:var(--text)}}
    button,input{font:inherit}button{border:1px solid var(--line);border-radius:8px;background:#1b2532;color:var(--text);min-height:42px;padding:0 14px;cursor:pointer}button:hover{border-color:#3e4d62;background:#223044}button.primary{border-color:rgba(69,229,138,.55);background:#123321;color:#dfffea}button.danger{border-color:rgba(255,91,110,.58);background:#35161d;color:#ffe1e5}input[type=range]{width:100%;accent-color:var(--green)}
    .app{width:min(1360px,calc(100vw - 32px));margin:0 auto;padding:20px 0 28px}.topbar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;min-height:62px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:baseline;gap:14px;min-width:0}.brand h1{margin:0;font-size:clamp(26px,4vw,48px);line-height:1;font-weight:780;letter-spacing:0}.brand span{color:var(--muted);font-size:14px;white-space:nowrap}.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;white-space:nowrap}.dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 18px rgba(255,91,110,.5)}.dot.live{background:var(--green);box-shadow:0 0 18px rgba(69,229,138,.55)}
    .layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,.8fr);gap:16px;margin-top:16px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.metric{min-height:180px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}.metric.main{min-height:260px;grid-column:span 2;background:#0e1714;border-color:rgba(69,229,138,.34)}.label{color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.08em}.value{margin-top:12px;font-variant-numeric:tabular-nums;font-size:clamp(48px,9vw,128px);line-height:.95;font-weight:820}.metric:not(.main) .value{font-size:clamp(36px,5vw,72px)}.unit{color:var(--muted);font-size:22px;font-weight:520}.hint{color:var(--muted);font-size:14px;line-height:1.45;min-height:20px}
    .panel{padding:18px}.panel+.panel{margin-top:16px}.panel h2{margin:0 0 14px;font-size:18px;font-weight:720}.controls{display:grid;gap:14px}.control{display:grid;gap:8px}.control-head{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px}.control-head strong{color:var(--text);font-variant-numeric:tabular-nums}.button-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.calibration{display:grid;gap:10px}.cal-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;min-height:54px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.cal-row strong{display:block;font-size:15px}.cal-row span{color:var(--muted);display:block;margin-top:2px;font-size:13px}.tag{display:inline-flex;align-items:center;justify-content:center;min-width:74px;min-height:28px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}.tag.ready{border-color:rgba(69,229,138,.42);color:var(--green)}.chart-panel{margin-top:16px;height:300px;padding:18px}.chart-wrap{height:240px;width:100%}.log{max-height:136px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0b1018;color:var(--muted);font-size:13px;line-height:1.45}.log div+div{margin-top:5px}
    @media(max-width:980px){.layout,.topbar{grid-template-columns:1fr}.status{justify-content:flex-start}}@media(max-width:680px){.app{width:min(100vw - 20px,1360px);padding-top:12px}.metrics{grid-template-columns:1fr}.metric.main{grid-column:span 1}.button-grid{grid-template-columns:1fr}.brand{display:block}.brand span{display:block;margin-top:8px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><h1>AirSwing Lab</h1><span>Table Tennis MVP</span></div><div class="status" aria-live="polite"><span id="liveDot" class="dot"></span><span id="connectionText">等待 iPad 数据</span><span id="sampleRate">0 Hz</span></div></header>
    <section class="layout">
      <div><div class="metrics">
        <article class="metric main"><div><div class="label">击球总数</div><div class="value" id="hitCount">0</div></div><div class="hint" id="lastHitText">等待第一次有效触球</div></article>
        <article class="metric"><div><div class="label">当前冲击</div><div class="value"><span id="currentG">0.00</span><span class="unit"> g</span></div></div><div class="hint">合成加速度模长</div></article>
        <article class="metric"><div><div class="label">实时转速</div><div class="value"><span id="currentRot">0.00</span><span class="unit"> rad/s</span></div></div><div class="hint">三轴角速度绝对值之和</div></article>
        <article class="metric"><div><div class="label">最大冲击</div><div class="value"><span id="maxG">0.00</span><span class="unit"> g</span></div></div><div class="hint">本次 session 峰值</div></article>
        <article class="metric"><div><div class="label">拍面姿态</div><div class="value"><span id="faceState">未知</span></div></div><div class="hint" id="faceHint">完成正面和反面校准后显示</div></article>
      </div><section class="panel chart-panel"><h2>最近 3 秒动态</h2><div class="chart-wrap"><canvas id="motionChart"></canvas></div></section></div>
      <aside>
        <section class="panel"><h2>实时控制</h2><div class="controls">
          <div class="control"><div class="control-head"><span>G 阈值</span><strong><span id="gThresholdValue">2.8</span> g</strong></div><input id="gThreshold" type="range" min="1.0" max="8.0" step="0.1" value="2.8"></div>
          <div class="control"><div class="control-head"><span>转速阈值</span><strong><span id="rotThresholdValue">3.5</span> rad/s</strong></div><input id="rotThreshold" type="range" min="0.5" max="12.0" step="0.1" value="3.5"></div>
          <div class="control"><div class="control-head"><span>冷却时间</span><strong><span id="cooldownValue">180</span> ms</strong></div><input id="cooldown" type="range" min="80" max="500" step="10" value="180"></div>
          <div class="button-grid"><button class="primary" id="simulateHit">模拟击球</button><button id="simulateStream">模拟连续流</button><button id="muteToggle">声音开启</button><button class="danger" id="resetSession">重置 session</button></div>
        </div></section>
        <section class="panel"><h2>校准</h2><div class="calibration">
          <div class="cal-row"><div><strong>正面朝上</strong><span>球拍正面向上平放，静止 2 秒</span></div><button id="calFront">开始</button></div>
          <div class="cal-row"><div><strong>反面朝上</strong><span>球拍反面向上平放，静止 2 秒</span></div><button id="calBack">开始</button></div>
          <div class="cal-row"><div><strong>静止噪声</strong><span>球拍保持不动，用于降低误触发</span></div><button id="calNoise">开始</button></div>
          <div class="button-grid"><span class="tag" id="frontTag">Front</span><span class="tag" id="backTag">Back</span><span class="tag" id="noiseTag">Noise</span><button id="clearCalibration">清除校准</button></div>
        </div></section>
        <section class="panel"><h2>Session</h2><div class="button-grid"><button id="exportJson">导出 JSON</button><button id="exportCsv">导出 CSV</button></div><div class="log" id="eventLog" aria-live="polite"></div></section>
      </aside>
    </section>
  </main>
  <script>
    const CONFIG_KEY="airswing-table-tennis-config",CAL_KEY="airswing-table-tennis-calibration",MAX_SESSION_SAMPLES=20000,CHART_WINDOW_MS=3000;
    const $=id=>document.getElementById(id);const els={liveDot:$("liveDot"),connectionText:$("connectionText"),sampleRate:$("sampleRate"),hitCount:$("hitCount"),lastHitText:$("lastHitText"),currentG:$("currentG"),currentRot:$("currentRot"),maxG:$("maxG"),faceState:$("faceState"),faceHint:$("faceHint"),gThreshold:$("gThreshold"),rotThreshold:$("rotThreshold"),cooldown:$("cooldown"),gThresholdValue:$("gThresholdValue"),rotThresholdValue:$("rotThresholdValue"),cooldownValue:$("cooldownValue"),simulateHit:$("simulateHit"),simulateStream:$("simulateStream"),muteToggle:$("muteToggle"),resetSession:$("resetSession"),calFront:$("calFront"),calBack:$("calBack"),calNoise:$("calNoise"),clearCalibration:$("clearCalibration"),frontTag:$("frontTag"),backTag:$("backTag"),noiseTag:$("noiseTag"),exportJson:$("exportJson"),exportCsv:$("exportCsv"),eventLog:$("eventLog"),chart:$("motionChart")};
    function loadConfig(){const f={gThreshold:2.8,rotThreshold:3.5,cooldown:180};try{return{...f,...JSON.parse(localStorage.getItem(CONFIG_KEY)||"{}")}}catch{return f}}function loadCalibration(){const f={front:null,back:null,noise:null};try{return{...f,...JSON.parse(localStorage.getItem(CAL_KEY)||"{}")}}catch{return f}}
    const state={hitCount:0,maxG:0,lastHitAt:0,lastSampleAt:0,sampleTimestamps:[],session:[],chartSamples:[],muted:false,simulateTimer:null,calibration:loadCalibration(),config:loadConfig(),audio:null,chart:null};
    const mag=(x,y,z)=>Math.sqrt(x*x+y*y+z*z),fmt=(v,d=2)=>Number.isFinite(v)?v.toFixed(d):"0.00",rand=(a,b)=>a+Math.random()*(b-a);function saveConfig(){localStorage.setItem(CONFIG_KEY,JSON.stringify(state.config))}function saveCalibration(){localStorage.setItem(CAL_KEY,JSON.stringify(state.calibration));renderCalibrationTags()}function norm(v){const m=mag(v.x,v.y,v.z)||1;return{x:v.x/m,y:v.y/m,z:v.z/m}}function dot(a,b){return a.x*b.x+a.y*b.y+a.z*b.z}
    function classifyFace(acc){if(!state.calibration.front||!state.calibration.back)return{label:"未知",hint:"完成正面和反面校准后显示"};const c=norm(acc),fs=dot(c,norm(state.calibration.front)),bs=dot(c,norm(state.calibration.back));if(Math.abs(fs-bs)<.15)return{label:"过渡",hint:"当前姿态接近侧放或运动中"};return fs>bs?{label:"正面",hint:`匹配度 ${fmt(fs,2)}`}:{label:"反面",hint:`匹配度 ${fmt(bs,2)}`}}
    function updateConfigUI(){els.gThreshold.value=state.config.gThreshold;els.rotThreshold.value=state.config.rotThreshold;els.cooldown.value=state.config.cooldown;els.gThresholdValue.textContent=fmt(state.config.gThreshold,1);els.rotThresholdValue.textContent=fmt(state.config.rotThreshold,1);els.cooldownValue.textContent=String(state.config.cooldown)}function renderCalibrationTags(){els.frontTag.classList.toggle("ready",!!state.calibration.front);els.backTag.classList.toggle("ready",!!state.calibration.back);els.noiseTag.classList.toggle("ready",!!state.calibration.noise)}function logEvent(text){const line=document.createElement("div");line.textContent=`${new Date().toLocaleTimeString()}  ${text}`;els.eventLog.prepend(line);while(els.eventLog.children.length>18)els.eventLog.lastElementChild.remove()}
    function ensureAudio(){if(!state.audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)state.audio=new AC()}if(state.audio&&state.audio.state==="suspended")state.audio.resume();return state.audio}function playBeep(){if(state.muted)return;const audio=ensureAudio();if(!audio)return;const osc=audio.createOscillator(),gain=audio.createGain();osc.type="sine";osc.frequency.setValueAtTime(880,audio.currentTime);gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.24,audio.currentTime+.01);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.1);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.11)}function feedback(g,r){playBeep();document.body.classList.remove("flash");void document.body.offsetWidth;document.body.classList.add("flash");logEvent(`Hit #${state.hitCount}: ${fmt(g)} g, ${fmt(r)} rad/s`)}
    function setLive(live){els.liveDot.classList.toggle("live",live);els.connectionText.textContent=live?"接收中":"等待 iPad 数据"}function sampleRate(now){state.sampleTimestamps.push(now);const cut=now-1000;while(state.sampleTimestamps.length&&state.sampleTimestamps[0]<cut)state.sampleTimestamps.shift();els.sampleRate.textContent=`${state.sampleTimestamps.length} Hz`}function pushSample(s){state.session.push(s);if(state.session.length>MAX_SESSION_SAMPLES)state.session.splice(0,state.session.length-MAX_SESSION_SAMPLES);state.chartSamples.push({t:s.t,g:s.totalG,rot:s.totalRot});const cut=s.t-CHART_WINDOW_MS;while(state.chartSamples.length&&state.chartSamples[0].t<cut)state.chartSamples.shift()}
    function processSensorData(accX,accY,accZ,rotX,rotY,rotZ,source="ipad"){const now=performance.now(),totalG=mag(accX,accY,accZ),rawRot=Math.abs(rotX)+Math.abs(rotY)+Math.abs(rotZ),baseRot=state.calibration.noise?state.calibration.noise.totalRot:0,totalRot=Math.max(0,rawRot-baseRot),face=classifyFace({x:accX,y:accY,z:accZ});state.lastSampleAt=now;state.maxG=Math.max(state.maxG,totalG);sampleRate(now);const isHit=totalG>state.config.gThreshold&&totalRot>state.config.rotThreshold&&now-state.lastHitAt>state.config.cooldown;if(isHit){state.hitCount++;state.lastHitAt=now;els.hitCount.textContent=String(state.hitCount);els.lastHitText.textContent=`最近一次: ${new Date().toLocaleTimeString()}`;feedback(totalG,totalRot)}pushSample({t:now,wallTime:Date.now(),source,accX,accY,accZ,rotX,rotY,rotZ,totalG,totalRot,face:face.label,isHit});els.currentG.textContent=fmt(totalG);els.currentRot.textContent=fmt(totalRot);els.maxG.textContent=fmt(state.maxG);els.faceState.textContent=face.label;els.faceHint.textContent=face.hint;setLive(true);updateChart()}
    window.onSensorData=(accX,accY,accZ,rotX,rotY,rotZ)=>processSensorData(Number(accX),Number(accY),Number(accZ),Number(rotX),Number(rotY),Number(rotZ),"ipad");
    function initChart(){if(!window.Chart){logEvent("Chart.js 未加载，曲线暂不可用");return}state.chart=new Chart(els.chart,{type:"line",data:{labels:[],datasets:[{label:"totalG",data:[],borderColor:"#45e58a",backgroundColor:"rgba(69,229,138,.12)",tension:.25,borderWidth:2,pointRadius:0},{label:"totalRot",data:[],borderColor:"#68a6ff",backgroundColor:"rgba(104,166,255,.12)",tension:.25,borderWidth:2,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{intersect:false,mode:"index"},plugins:{legend:{labels:{color:"#97a3b3",boxWidth:12,boxHeight:12}}},scales:{x:{grid:{color:"rgba(151,163,179,.12)"},ticks:{color:"#97a3b3",maxTicksLimit:6}},y:{beginAtZero:true,grid:{color:"rgba(151,163,179,.12)"},ticks:{color:"#97a3b3"}}}}})}function updateChart(){if(!state.chart)return;const newest=state.chartSamples[state.chartSamples.length-1]?.t||performance.now();state.chart.data.labels=state.chartSamples.map(s=>`${((s.t-newest)/1000).toFixed(1)}s`);state.chart.data.datasets[0].data=state.chartSamples.map(s=>s.g);state.chart.data.datasets[1].data=state.chartSamples.map(s=>s.rot);state.chart.update("none")}
    function sampleAverage(ms,done){const started=performance.now(),samples=[],original=window.onSensorData;window.onSensorData=function(accX,accY,accZ,rotX,rotY,rotZ){samples.push({accX:+accX,accY:+accY,accZ:+accZ,rotX:+rotX,rotY:+rotY,rotZ:+rotZ});original(accX,accY,accZ,rotX,rotY,rotZ)};const timer=setInterval(()=>{if(performance.now()-started<ms)return;clearInterval(timer);window.onSensorData=original;if(!samples.length){logEvent("校准失败: 没有收到传感器数据，可先打开模拟连续流");done(null);return}const avg=samples.reduce((a,s)=>{a.accX+=s.accX;a.accY+=s.accY;a.accZ+=s.accZ;a.rotX+=s.rotX;a.rotY+=s.rotY;a.rotZ+=s.rotZ;return a},{accX:0,accY:0,accZ:0,rotX:0,rotY:0,rotZ:0});Object.keys(avg).forEach(k=>avg[k]/=samples.length);done({x:avg.accX,y:avg.accY,z:avg.accZ,totalG:mag(avg.accX,avg.accY,avg.accZ),totalRot:Math.abs(avg.rotX)+Math.abs(avg.rotY)+Math.abs(avg.rotZ),samples:samples.length})},100)}function startCalibration(kind,label){logEvent(`${label}校准开始，保持静止 2 秒`);sampleAverage(2000,result=>{if(!result)return;state.calibration[kind]=result;saveCalibration();logEvent(`${label}校准完成: ${result.samples} samples, ${fmt(result.totalG)} g`)})}
    function simulateHit(){ensureAudio();const base=rand(.94,1.08);for(let i=0;i<14;i++)setTimeout(()=>{const peak=i===5?rand(3.1,4.8):base+rand(-.12,.18),rotPeak=i===5?rand(4.1,7.2):rand(.2,1.1);processSensorData(rand(-.18,.18),rand(-.16,.16),peak,rand(-.5,.5),rotPeak,rand(-.7,.7),"sim")},i*14)}function toggleSimulationStream(){ensureAudio();if(state.simulateTimer){clearInterval(state.simulateTimer);state.simulateTimer=null;els.simulateStream.textContent="模拟连续流";logEvent("模拟连续流已停止");return}state.simulateTimer=setInterval(()=>{if(Math.random()>.94){simulateHit();return}processSensorData(rand(-.08,.08),rand(-.08,.08),rand(.94,1.05),rand(-.12,.12),rand(-.16,.16),rand(-.12,.12),"sim")},20);els.simulateStream.textContent="停止模拟流";logEvent("模拟连续流已启动")}
    function resetSession(){state.hitCount=0;state.maxG=0;state.lastHitAt=0;state.session=[];state.chartSamples=[];els.hitCount.textContent="0";els.maxG.textContent="0.00";els.lastHitText.textContent="等待第一次有效触球";updateChart();logEvent("Session 已重置")}function exportData(type){if(!state.session.length){logEvent("没有可导出的 session 数据");return}const stamp=new Date().toISOString().replace(/[:.]/g,"-"),headers=["wallTime","source","accX","accY","accZ","rotX","rotY","rotZ","totalG","totalRot","face","isHit"];let blob,name;if(type==="json"){blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),config:state.config,calibration:state.calibration,samples:state.session},null,2)],{type:"application/json"});name=`airswing-session-${stamp}.json`}else{const rows=state.session.map(s=>headers.map(k=>s[k]).join(","));blob=new Blob([[headers.join(","),...rows].join("\n")],{type:"text/csv"});name=`airswing-session-${stamp}.csv`}const url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);logEvent(`已导出 ${name}`)}
    function bindControls(){els.gThreshold.addEventListener("input",()=>{state.config.gThreshold=+els.gThreshold.value;updateConfigUI();saveConfig()});els.rotThreshold.addEventListener("input",()=>{state.config.rotThreshold=+els.rotThreshold.value;updateConfigUI();saveConfig()});els.cooldown.addEventListener("input",()=>{state.config.cooldown=+els.cooldown.value;updateConfigUI();saveConfig()});els.simulateHit.addEventListener("click",simulateHit);els.simulateStream.addEventListener("click",toggleSimulationStream);els.muteToggle.addEventListener("click",()=>{state.muted=!state.muted;els.muteToggle.textContent=state.muted?"声音关闭":"声音开启"});els.resetSession.addEventListener("click",resetSession);els.calFront.addEventListener("click",()=>startCalibration("front","正面朝上"));els.calBack.addEventListener("click",()=>startCalibration("back","反面朝上"));els.calNoise.addEventListener("click",()=>startCalibration("noise","静止噪声"));els.clearCalibration.addEventListener("click",()=>{state.calibration={front:null,back:null,noise:null};saveCalibration();logEvent("校准已清除")});els.exportJson.addEventListener("click",()=>exportData("json"));els.exportCsv.addEventListener("click",()=>exportData("csv"))}
    setInterval(()=>{const now=performance.now();if(state.lastSampleAt&&now-state.lastSampleAt>1300){setLive(false);els.sampleRate.textContent="0 Hz"}},500);updateConfigUI();renderCalibrationTags();bindControls();initChart();logEvent("MVP 已就绪。iPad 可调用 window.onSensorData(accX, accY, accZ, rotX, rotY, rotZ)");
  </script>
</body>
</html>
